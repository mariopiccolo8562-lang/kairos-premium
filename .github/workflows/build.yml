name: App Kairos Premium (APK)

# - ogni modifica compila un APK di prova (scheda Actions → Artifacts)
# - un tag vX.Y.Z (Releases → Draft a new release) pubblica la versione:
#   https://github.com/<utente>/kairos-premium/releases/latest/download/kairos-premium.apk  (link fisso per Downloader)
#   https://github.com/<utente>/kairos-premium/releases/latest/download/kairos-premium.json (letto dal pannello: aggiornamento automatico)
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Chiave di firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # senza i segreti la release non si pubblica da qui (va firmata a mano con la chiave di Kairos Premium)
            echo "::warning::Mancano i segreti della chiave di firma: solo APK di prova, release non pubblicata"
          else
            echo "::warning::Nessuna chiave di firma: APK di prova firmato con una chiave temporanea"
          fi

      - name: Versione
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            V="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))   # es. 1.2.3 → 10203
          else
            V="0.0.${GITHUB_RUN_NUMBER}"; CODE=${GITHUB_RUN_NUMBER}                          # build di prova
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Compila APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KAIROS_SERVER_URL: ${{ vars.KAIROS_SERVER_URL }}
          TV_APP_NAME: ${{ vars.TV_APP_NAME }}
          TV_APP_ID: ${{ vars.TV_APP_ID }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - run: cp app/build/outputs/apk/release/app-release.apk kairos-premium.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kairos-premium-apk-${{ env.VERSION_NAME }}
          path: kairos-premium.apk

      - name: File per l'aggiornamento automatico
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNED == '1'
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/kairos-premium.apk"
          jq -n --arg v "$VERSION_NAME" --argjson c "$VERSION_CODE" --arg u "$URL" --arg d "$(date -u +%FT%TZ)" \
            '{version:$v, versionCode:$c, url:$u, date:$d}' > kairos-premium.json
          cat kairos-premium.json

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kairos-premium.apk
            kairos-premium.json
          make_latest: true
          name: Kairos Premium ${{ env.VERSION_NAME }}
          generate_release_notes: true
